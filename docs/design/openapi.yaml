openapi: 3.0.3
info:
  title: stuffie-collection-app API
  description: ぬいぐるみ管理アプリのAPI仕様 (BFF経由)
  version: 1.0.0

servers:
  - url: http://localhost:8080/api
    description: ローカル開発環境
  - url: http://stuffie-collection.local/api
    description: 自宅k3s環境

tags:
  - name: auth
    description: 認証
  - name: series
    description: シリーズマスタ管理
  - name: stuffed-animals
    description: ぬいぐるみ管理

security:
  - bearerAuth: []

paths:
  # ─────────────────────────────────────────
  # 認証
  # ─────────────────────────────────────────
  /auth/register:
    post:
      tags: [auth]
      summary: ユーザー登録
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: バリデーションエラー (メールアドレス重複など)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      tags: [auth]
      summary: ログイン
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: ログイン成功・JWTトークン返却
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: 認証失敗
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      tags: [auth]
      summary: トークンリフレッシュ
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: 新しいアクセストークン返却
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: リフレッシュトークン無効
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      tags: [auth]
      summary: ログアウト
      responses:
        "204":
          description: ログアウト成功

  # ─────────────────────────────────────────
  # シリーズマスタ管理
  # ─────────────────────────────────────────
  /series:
    get:
      tags: [series]
      summary: シリーズ一覧取得 (プルダウン用)
      responses:
        "200":
          description: 一覧取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Series"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [series]
      summary: シリーズ登録
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeriesRequest"
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"
        "400":
          description: バリデーションエラー (名前重複など)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /series/{id}:
    put:
      tags: [series]
      summary: シリーズ更新
      parameters:
        - $ref: "#/components/parameters/seriesId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeriesRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [series]
      summary: シリーズ削除
      parameters:
        - $ref: "#/components/parameters/seriesId"
      responses:
        "204":
          description: 削除成功
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─────────────────────────────────────────
  # ぬいぐるみ管理
  # ─────────────────────────────────────────
  /stuffed-animals:
    get:
      tags: [stuffed-animals]
      summary: ぬいぐるみ一覧取得
      parameters:
        - name: name
          in: query
          schema:
            type: string
          description: 名前で部分一致検索
        - name: series
          in: query
          schema:
            type: string
          description: シリーズで絞り込み
        - name: character
          in: query
          schema:
            type: string
          description: キャラクターで絞り込み
      responses:
        "200":
          description: 一覧取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StuffedAnimal"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [stuffed-animals]
      summary: ぬいぐるみ新規登録
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StuffedAnimalRequest"
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StuffedAnimal"
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /stuffed-animals/{id}:
    get:
      tags: [stuffed-animals]
      summary: ぬいぐるみ1件取得
      parameters:
        - $ref: "#/components/parameters/stuffedAnimalId"
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StuffedAnimal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [stuffed-animals]
      summary: ぬいぐるみ更新
      parameters:
        - $ref: "#/components/parameters/stuffedAnimalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StuffedAnimalRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StuffedAnimal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [stuffed-animals]
      summary: ぬいぐるみ削除
      parameters:
        - $ref: "#/components/parameters/stuffedAnimalId"
      responses:
        "204":
          description: 削除成功
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /stuffed-animals/duplicate-check:
    post:
      tags: [stuffed-animals]
      summary: ダブりチェック
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicateCheckRequest"
      responses:
        "200":
          description: チェック結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateCheckResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    seriesId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: シリーズID

    stuffedAnimalId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: ぬいぐるみID

  responses:
    Unauthorized:
      description: 認証エラー (JWTトークンなし・期限切れ)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 該当データなし
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ─── 認証 ───
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          example: tanaka_taro
        email:
          type: string
          format: email
          example: taro@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: password123

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: taro@example.com
        password:
          type: string
          format: password
          example: password123

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9...

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9...
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: アクセストークンの有効期限 (秒)
          example: 3600

    # ─── ぬいぐるみ ───
    StuffedAnimal:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: くまのプーさん ぬいぐるみ
        series:
          type: string
          example: ディズニー
        character:
          type: string
          example: プーさん
        manufacturer:
          type: string
          example: オリエンタルランド
        size:
          type: string
          enum: [SS, S, M, L, XL]
          example: M
        color:
          type: string
          example: 黄色
        purchaseDate:
          type: string
          format: date
          example: "2024-03-15"
        purchasePlace:
          type: string
          example: 東京ディズニーランド
        imageUrl:
          type: string
          example: "http://example.com/image.jpg"
        notes:
          type: string
          example: 誕生日プレゼントでもらった
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StuffedAnimalRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: くまのプーさん ぬいぐるみ
        series:
          type: string
          example: ディズニー
        character:
          type: string
          example: プーさん
        manufacturer:
          type: string
          example: オリエンタルランド
        size:
          type: string
          enum: [SS, S, M, L, XL]
          example: M
        color:
          type: string
          example: 黄色
        purchaseDate:
          type: string
          format: date
          example: "2024-03-15"
        purchasePlace:
          type: string
          example: 東京ディズニーランド
        imageUrl:
          type: string
        notes:
          type: string

    DuplicateCheckRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: くまのプーさん ぬいぐるみ
        series:
          type: string
          example: ディズニー
        character:
          type: string
          example: プーさん
        manufacturer:
          type: string
          example: オリエンタルランド

    DuplicateCheckResponse:
      type: object
      properties:
        isDuplicate:
          type: boolean
          example: true
        duplicates:
          type: array
          items:
            $ref: "#/components/schemas/StuffedAnimal"

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 401
        message:
          type: string
          example: 認証トークンが無効です
        timestamp:
          type: string
          format: date-time
    Series:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: ディズニー
        createdBy:
          type: integer
          format: int64
          example: 1
        createdAt:
          type: string
          format: date-time

    SeriesRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: ディズニー
