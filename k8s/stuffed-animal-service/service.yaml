apiVersion: v1
kind: Service
metadata:
  name: stuffed-animal-service
  namespace: stuffie-collection
spec:
  selector:
    app: stuffed-animal-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    - name: grpc
      port: 9091
      targetPort: 9091
  # ClusterIP（デフォルト）: bff-serviceからのみアクセスされる想定。外部には公開しない。
