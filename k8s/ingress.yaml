apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stuffie-collection-ingress
  namespace: stuffie-collection
spec:
  ingressClassName: traefik
  rules:
    - host: stuffie-collection.local
      http:
        paths:
          # 画像は公開バケットへ直接ルーティングする（frontendを経由させない）
          # 順序が重要: より具体的なパスを先に書く（Traefikは上から順にマッチを試みるため）
          - path: /stuffie-images
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
          # それ以外は全部frontendへ（frontendのnginxが/apiをbff-serviceに内部プロキシする）
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
