grpc:
  server:
    port: 9091

server:
  port: 8081

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:stuffie_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:stuffie-secret-key-must-be-at-least-32-characters-long}
  expiration: 3600

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

minio:
  # k3s内ではServiceの名前がそのまま使える（他のサービスと同じ考え方）
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:stuffie-admin}
  secret-key: ${MINIO_SECRET_KEY:stuffie-minio-password-change-me}
  bucket-name: ${MINIO_BUCKET_NAME:stuffie-images}
  # ブラウザから直接アクセスするための公開URL（Ingress経由）
  public-url-base: ${MINIO_PUBLIC_URL_BASE:http://stuffie-collection.local/stuffie-images}
