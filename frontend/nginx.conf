server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 画像アップロードなど大きめのリクエストボディを許可する
    # （デフォルトは1MBで、スマホの写真がすぐ超えてしまうため）
    client_max_body_size 15M;

    # React Routerを使う場合に備えたSPA対応（未使用でも害はない）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # フロントは常にbff-serviceだけを窓口として叩く（stuffed-animal-serviceには直接繋がない）
    location /api {
        proxy_pass http://bff-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 画像アップロードは処理に少し時間がかかるため、タイムアウトも延ばしておく
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}