services:
  postgres:
    image: postgres:16-alpine
    container_name: stuffie-postgres
    environment:
      POSTGRES_DB: stuffie_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  stuffed-animal-service:
    build:
      context: .
      dockerfile: stuffed-animal-service/Dockerfile
    container_name: stuffie-stuffed-animal-service
    environment:
      DB_HOST: postgres
      DB_NAME: stuffie_db
      DB_USER: postgres
      DB_PASSWORD: password
      # bff-serviceと必ず同じ値にすること（JWT署名の検証に使うため）
      JWT_SECRET: stuffie-secret-key-must-be-at-least-32-characters-long
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8081:8081"
      - "9091:9091"
    depends_on:
      postgres:
        condition: service_healthy

  bff-service:
    build:
      context: .
      dockerfile: bff-service/Dockerfile
    container_name: stuffie-bff-service
    environment:
      # コンテナ間はサービス名で名前解決できるため localhost ではなくこちらを指定
      STUFFED_ANIMAL_SERVICE_HOST: stuffed-animal-service
      STUFFED_ANIMAL_SERVICE_GRPC_PORT: 9091
      JWT_SECRET: stuffie-secret-key-must-be-at-least-32-characters-long
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      - stuffed-animal-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stuffie-frontend
    ports:
      - "5173:80"
    depends_on:
      - bff-service

volumes:
  postgres-data:
