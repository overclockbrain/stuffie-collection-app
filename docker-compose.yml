services:
  postgres:
    image: postgres:16-alpine
    container_name: stuffie-postgres
    environment:
      POSTGRES_DB: stuffie_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: stuffie-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: stuffie-admin
      MINIO_ROOT_PASSWORD: stuffie-minio-password-change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  stuffed-animal-service:
    image: 192.168.40.246:5050/ikuchans/stuffie-collection-app/stuffed-animal-service:latest
    build:
      context: .
      dockerfile: stuffed-animal-service/Dockerfile
    container_name: stuffie-stuffed-animal-service
    environment:
      DB_HOST: postgres
      DB_NAME: stuffie_db
      DB_USER: postgres
      DB_PASSWORD: password
      JWT_SECRET: stuffie-secret-key-must-be-at-least-32-characters-long
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SPRING_PROFILES_ACTIVE: dev
      # ↓ ここから追加
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: stuffie-admin
      MINIO_SECRET_KEY: stuffie-minio-password-change-me
      MINIO_BUCKET_NAME: stuffie-images
      MINIO_PUBLIC_URL_BASE: http://localhost:9000/stuffie-images
    ports:
      - "8081:8081"
      - "9091:9091"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  bff-service:
    image: 192.168.40.246:5050/ikuchans/stuffie-collection-app/bff-service:latest
    build:
      context: .
      dockerfile: bff-service/Dockerfile
    container_name: stuffie-bff-service
    environment:
      STUFFED_ANIMAL_SERVICE_HOST: stuffed-animal-service
      STUFFED_ANIMAL_SERVICE_GRPC_PORT: 9091
      JWT_SECRET: stuffie-secret-key-must-be-at-least-32-characters-long
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      - stuffed-animal-service

  frontend:
    image: 192.168.40.246:5050/ikuchans/stuffie-collection-app/frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stuffie-frontend
    ports:
      - "5173:80"
    depends_on:
      - bff-service

volumes:
  postgres-data:
  minio-data:
