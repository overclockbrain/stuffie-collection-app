syntax = "proto3";

package stuffie.stuffedanimal;

import "common.proto";

option java_multiple_files = true;
option java_package = "com.stuffie.grpc.stuffedanimal";

// ぬいぐるみ管理サービス
service StuffedAnimalService {
  // 一覧取得（絞り込み可能）
  rpc GetAnimals (GetAnimalsRequest) returns (GetAnimalsResponse);
  // 1件取得
  rpc GetAnimal (GetAnimalRequest) returns (StuffedAnimalMessage);
  // 登録
  rpc CreateAnimal (CreateAnimalRequest) returns (StuffedAnimalMessage);
  // 更新（本人かADMINのみ）
  rpc UpdateAnimal (UpdateAnimalRequest) returns (StuffedAnimalMessage);
  // 削除（本人かADMINのみ）
  rpc DeleteAnimal (DeleteAnimalRequest) returns (stuffie.common.Empty);
  // ダブりチェック
  rpc CheckDuplicate (CheckDuplicateRequest) returns (CheckDuplicateResponse);
  // 画像アップロード（チャンク分割してストリーミング送信、本人かADMINのみ）
  rpc UploadImage (stream UploadImageChunk) returns (UploadImageResponse);
}

message StuffedAnimalMessage {
  int64 id = 1;
  string name = 2;
  optional int64 series_id = 3;
  optional string series_name = 4;
  optional string character = 5;
  optional string purchase_date = 6;
  optional string purchase_place = 7;
  optional string image_url = 8;
  optional string notes = 9;
  int64 created_by = 10;
  int64 updated_by = 11;
  string created_at = 12;
  string updated_at = 13;
}

message GetAnimalsRequest {
  optional string name = 1;
  optional int64 series_id = 2;
  optional string character = 3;
}

message GetAnimalsResponse {
  repeated StuffedAnimalMessage animals = 1;
}

message GetAnimalRequest {
  int64 id = 1;
}

message CreateAnimalRequest {
  string name = 1;
  optional int64 series_id = 2;
  optional string character = 3;
  optional string purchase_date = 4;
  optional string purchase_place = 5;
  optional string image_url = 6;
  optional string notes = 7;
  string user_email = 8;
}

message UpdateAnimalRequest {
  int64 id = 1;
  string name = 2;
  optional int64 series_id = 3;
  optional string character = 4;
  optional string purchase_date = 5;
  optional string purchase_place = 6;
  optional string image_url = 7;
  optional string notes = 8;
  string user_email = 9;
}

message DeleteAnimalRequest {
  int64 id = 1;
  string user_email = 2;
}

message CheckDuplicateRequest {
  string name = 1;
  optional int64 series_id = 2;
  optional string character = 3;
}

message CheckDuplicateResponse {
  repeated StuffedAnimalMessage duplicates = 1;
}

// ─────────────────────────────────────────
// 画像アップロード用メッセージ
// ─────────────────────────────────────────

// クライアントはこのメッセージを繰り返し送信する（streaming）。
// 1個目のチャンクにはメタ情報（animal_id・user_email・content_type）を含め、
// 以降は data のみを送り続ける想定。
message UploadImageChunk {
  int64 animal_id = 1;
  bytes data = 2;
  // 最初のチャンクにのみ設定する（2個目以降は空文字でよい）
  string user_email = 3;
  // 最初のチャンクにのみ設定する（例: image/jpeg）
  string content_type = 4;
}

message UploadImageResponse {
  string image_url = 1;
}
